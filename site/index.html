<!doctype html>
<html lang="vi" data-ui-hash="__UI_HASH__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f7f3">
  <title>Điểm tin quốc tế</title>
  <link rel="icon" type="image/svg+xml" href="./mark.svg">
  <link rel="stylesheet" href="./styles.css?v=__UI_HASH__">
  <script defer src="./app.js?v=__UI_HASH__"></script>
</head>
<body>
  <a class="skip" href="#articles">Đi tới danh sách tin</a>
  <div class="sheet">
    <header class="masthead">
      <div class="identity">
        <img alt="" aria-hidden="true" width="41" height="41" src="./mark.svg">
        <h1>Điểm tin <span>quốc tế</span></h1>
      </div>
      <div class="edition">
        <span>Bản xuất bản gần nhất</span>
        <time id="published">Đang tải…</time>
        <small id="last-checked"></small>
      </div>
    </header>
    <main class="workspace">
      <section class="news" aria-label="Bảng tin">
        <div id="views" class="views" role="group" aria-label="Cách xếp tin">
          <button type="button" data-view="latest" aria-pressed="true">Mới nhất</button>
          <button type="button" data-view="hot" aria-pressed="false">Tin nóng</button>
          <button type="button" data-view="selected" aria-pressed="false">Tuyển chọn</button>
        </div>
        <div class="tools">
          <div id="markets" class="markets" role="group" aria-label="Thị trường nguồn">
            <button type="button" data-market="all" aria-pressed="true">Tất cả</button>
            <button type="button" data-market="CN" aria-pressed="false">Trung Quốc</button>
            <button type="button" data-market="US" aria-pressed="false">Mỹ</button>
            <button type="button" data-market="intl" aria-pressed="false">Quốc tế</button>
          </div>
          <span class="count" id="event-count"></span>
        </div>
        <div id="notice" role="status"></div>
        <section id="articles" tabindex="-1" aria-label="Danh sách sự kiện">
          <p class="empty">Đang tải bảng tin…</p>
        </section>
        <button class="more" type="button" id="more" hidden>Xem thêm sự kiện</button>
        <noscript>Bật JavaScript để đọc bảng tin. Bạn cũng có thể mở <a href="./feed.json">dữ liệu bảng tin</a>.</noscript>
      </section>
      <aside class="rail" aria-labelledby="source-title">
        <header class="rail-header"><h2 id="source-title">Nguồn theo dõi</h2><span id="source-count"></span></header>
        <p class="rail-note">Trạng thái tại thời điểm xuất bản.</p>
        <div id="sources"></div>
        <button type="button" class="refresh" id="refresh">Kiểm tra bản mới <span aria-hidden="true">↻</span></button>
        <p class="translation-credit">Tiêu đề tiếng Trung được dịch sang tiếng Anh bằng <a href="https://huggingface.co/Helsinki-NLP/opus-mt-zh-en">OPUS-MT của Helsinki-NLP</a> (<a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>). Mở “Đối chiếu” để đọc nguyên văn.</p>
      </aside>
    </main>
  </div>
</body>
</html>
